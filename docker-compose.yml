version: '3.9'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dumbproxy-telegram-bot
    
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - ADMIN_USER_ID=${ADMIN_USER_ID}
      - BALANCER_IP=${BALANCER_IP}
      - PROXY1_IP=${PROXY1_IP}
      - PROXY2_IP=${PROXY2_IP}
      - PROXY3_IP=${PROXY3_IP}
      - SSH_USER=root
      - SSH_TIMEOUT=10
      - LOG_LEVEL=INFO
      - CHECK_INTERVAL=300
      - ENABLE_HEALTH_CHECKS=true
    
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - ./logs:/app/logs
    
    restart: unless-stopped
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
